<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 文衡 · 学位论文评审实验平台</title>
    <meta name="description" content="文衡 · 学位论文评审实验平台 - 登录">
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/portal.css">
</head>
<body class="auth-page">
    <main class="auth-layout">

        <!-- Left: Brand Visual -->
        <section class="auth-visual" aria-hidden="true">
            <div class="auth-visual__brand">
                <h1 class="auth-visual__name">文衡</h1>
                <p class="auth-visual__tagline"><em>学位论文</em>评审实验平台</p>
                <p class="auth-visual__subtitle">文衡谱元 · 团队内部测试</p>
            </div>
            <div class="auth-visual__stage">
                <span class="auth-visual__halo auth-visual__halo--one"></span>
                <span class="auth-visual__halo auth-visual__halo--two"></span>
                <span class="auth-visual__halo auth-visual__halo--three"></span>
                <span class="auth-visual__grid"></span>
                <span class="auth-visual__line auth-visual__line--x"></span>
                <span class="auth-visual__line auth-visual__line--y"></span>
                <span class="auth-visual__line auth-visual__line--x2"></span>
                <span class="auth-visual__line auth-visual__line--y2"></span>
            </div>
        </section>

        <!-- Right: Login Form -->
        <section class="auth-side">
            <section class="auth-panel">
                <div class="auth-panel__header">
                    <p class="auth-panel__eyebrow">Console Access</p>
                    <h2 class="auth-panel__title">登录</h2>
                    <p class="auth-panel__desc">登录文衡，开展硕博学位论文评审测试。</p>
                </div>

                <nav class="auth-switcher" aria-label="认证导航">
                    <a class="auth-switcher__item auth-switcher__item--active" href="login.html">登录</a>
                    <a class="auth-switcher__item" href="register.html">注册</a>
                </nav>

                <form id="login-form" class="auth-form">
                    <div class="auth-field">
                        <label class="auth-field__label" for="login-username">用户名</label>
                        <input id="login-username" type="text" class="auth-field__input" placeholder="3–32 位文字、数字或下划线" minlength="3" maxlength="32" autocomplete="username" required />
                    </div>

                    <div class="auth-field">
                        <label class="auth-field__label" for="login-password">密码</label>
                        <input id="login-password" type="password" class="auth-field__input" placeholder="输入密码" maxlength="128" autocomplete="current-password" required />
                    </div>

                    <button type="submit" class="auth-submit">登录 →</button>
                    <div id="auth-message" class="hidden auth-message" role="alert"></div>
                </form>

                <p class="auth-footer">
                    还没有账号？
                    <a href="register.html">创建新账户</a>
                </p>
            </section>
        </section>
    </main>

    <script src="/js/auth.js"></script>
</body>
</html>
