<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 文衡 · 学位论文评审实验平台</title>
    <meta name="description" content="文衡 · 学位论文评审实验平台 - 注册新账户">
    <link rel="stylesheet" href="/css/theme.css">
</head>
<body class="auth-page">
    <main class="auth-layout">

        <section class="auth-visual">
            <div class="auth-visual__brand"><span class="brand-mark brand-mark--lg">文</span><span class="auth-visual__name">文衡</span></div>
            <div class="auth-visual__body">
                <h1 class="auth-visual__tagline">学位论文评审实验平台</h1>
                <p class="auth-visual__lead">面向硕士、博士学位论文，从 PDF 上传、模型评审到原文证据核验，在同一个工作台完成。</p>
                <ul class="auth-features">
                    <li><strong>六维度评审</strong><span>选题、文献、逻辑、工作量、创新性与规范性，18 个分项逐项评分</span></li>
                    <li><strong>原文证据定位</strong><span>每条意见关联论文页码与原文段落，点击即可核验</span></li>
                    <li><strong>评审重点可迭代</strong><span>按维度保存评审重点版本，修改后可对已有论文重新评审</span></li>
                </ul>
            </div>
            <p class="auth-visual__foot">文衡谱元团队 · 内部测试版本</p>
        </section>

        <!-- Right: Register Form -->
        <section class="auth-side">
            <section class="auth-panel">
                <div class="auth-panel__header">
                    <h2 class="auth-panel__title">注册</h2>
                    <p class="auth-panel__desc">创建账号后即可上传论文并开展评审测试。</p>
                </div>

                <nav class="auth-switcher" aria-label="认证导航">
                    <a class="auth-switcher__item" href="login.html">登录</a>
                    <a class="auth-switcher__item auth-switcher__item--active" href="register.html">注册</a>
                </nav>

                <form id="register-form" class="auth-form">
                    <div class="auth-field">
                        <label class="auth-field__label" for="reg-username">用户名</label>
                        <input id="reg-username" type="text" class="auth-field__input" placeholder="3–32 位文字、数字或下划线" minlength="3" maxlength="32" autocomplete="username" required />
                    </div>

                    <div class="auth-field">
                        <label class="auth-field__label" for="reg-phone">联系电话（选填）</label>
                        <input id="reg-phone" type="tel" class="auth-field__input" placeholder="联系电话，可留空" maxlength="20" autocomplete="tel" />
                    </div>

                    <div class="auth-field">
                        <label class="auth-field__label" for="reg-password">密码</label>
                        <input id="reg-password" type="password" class="auth-field__input" placeholder="至少 8 位密码" minlength="8" maxlength="128" autocomplete="new-password" required />
                    </div>

                    <div class="auth-field"><label class="auth-field__label" for="reg-confirm">确认密码</label><input id="reg-confirm" type="password" class="auth-field__input" placeholder="再次输入密码" minlength="8" maxlength="128" autocomplete="new-password" required></div>
                    <div class="auth-field"><label class="auth-field__label" for="reg-invite">邀请码</label><input id="reg-invite" type="text" class="auth-field__input" placeholder="内部使用，请向管理员索取" maxlength="64" autocomplete="off" required /></div>
                    <button type="submit" class="auth-submit">注册</button>
                    <div id="auth-message" class="hidden auth-message" role="alert"></div>
                </form>

                <p class="auth-footer">
                    已有账号？
                    <a href="login.html">返回登录</a>
                </p>
            </section>
        </section>
    </main>

    <script src="/js/auth.js"></script>
</body>
</html>
